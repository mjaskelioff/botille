name: Update flake.lock

on:
  schedule:
    - cron: '30 0 * * 1'  # Every Monday at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.update.outputs.changed == 'true'
        with:
          name: updated-flake-lock
          path: flake.lock
          retention-days: 1

  validate:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/check.yml
    with:
      lockfile-artifact: updated-flake-lock
      require-cache: true
    secrets: inherit

  publish:
    needs: [update, validate]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: updated-flake-lock
      - name: Commit and push the validated lockfile
        env:
          BOTILLE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'Mauro Jaskelioff'
          git config user.email 'mjaskelioff@gmail.com'
          git add flake.lock
          git commit -m 'flake: update flake.lock'
          git push origin "HEAD:$BOTILLE_BRANCH"
